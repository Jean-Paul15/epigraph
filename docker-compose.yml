
services:
  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    container_name: epigraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?définir NEO4J_PASSWORD dans .env}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/csv:/var/lib/neo4j/import
      - ./neo4j/scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [epigraph-network]

  data-generator:
    build:
      context: ./data/scripts
      dockerfile: Dockerfile
    container_name: epigraph-generator
    volumes:
      - ./data/csv:/app/output
    environment:
      - OUTPUT_DIR=/app/output
      - SEED=42
    networks: [epigraph-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epigraph-backend
    ports: ["8000:8000"]
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?définir NEO4J_PASSWORD dans .env}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/models:/app/models
    depends_on:
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [epigraph-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epigraph-frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [epigraph-network]

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: epigraph-jupyter
    ports: ["8888:8888"]
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:?définir JUPYTER_TOKEN dans .env}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?définir NEO4J_PASSWORD dans .env}
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      neo4j: { condition: service_healthy }
    networks: [epigraph-network]

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  epigraph-network:
    driver: bridge
